name: blog-publish

# 하루 8편(임시, 한국시간 9·11·12·14·16·18·20·22시). 2026-10-28: GitHub 예약 실행이 정해진 시각을 자주 통째로 누락한다(10/27 21시, 10/28 10시).
# → 10:00~22:59 KST 동안 20분마다 깨워 '지금까지 지났어야 할 슬롯 수보다 발행이 모자라면 1편'(catchup_guard)만 한다.
#   할 일이 없으면 설치 전 확인 단계에서 10초 안에 끝나므로(공개 레포) 비용이 거의 없고, 한두 번 누락돼도 20분 안에 따라잡는다.
on:
  schedule:
    - cron: "7,27,47 0-13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "드라이런(발행 안 함)"
        type: boolean
        default: true
      mode:
        description: "slot=바로 1편 / guard=밀린 것만 보충 / force=시간·편수 제한 무시하고 1편(수동 재발행) / roundup=월간 축제 총정리만(실패해도 다른 주제로 안 넘어감)"
        type: choice
        options: [slot, guard, force, roundup, roundup_tistory]
        default: slot

concurrency:
  group: blog-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest  # 오라클 서버 연결되면 [self-hosted, oracle]로 전환
    timeout-minutes: 100
    env:
      TZ: Asia/Seoul
      PYTHONIOENCODING: utf-8
      NAVER_ID: ${{ vars.NAVER_ID || 'livinglegeno' }}
      CHROME_CHANNEL: chrome
      PIPELINE_BACKEND: hybrid
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      # 2026-10-30: 큐에서 기다리던 실행은 '요청 시점'의 커밋으로 체크아웃돼 앞 실행이 남긴 상태(run_state·used_state·topics)가 빠진 채
      # 돌았고, 끝의 상태 저장이 충돌해 발행 이력이 통째로 사라졌다(run 34). 항상 최신 main에서 시작한다.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: gh CLI(셀프 호스트 서버에 없으면 설치)
        run: command -v gh > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq gh > /dev/null)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 할 일 확인(설치 전 — Actions 사용 시간 절약)
        id: gate
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'guard' }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          if [ "$DRY" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "드라이런 — 항상 실행"; exit 0; fi
          python catchup_guard.py --precheck "$MODE"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "20"

      - name: Claude Code CLI (구독 토큰 사용)
        if: steps.gate.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code && claude --version

      - name: 시스템 패키지(가상 화면·한글 폰트)
        if: steps.gate.outputs.run == 'true'
        # 2026-10-27: apt 미러가 멈춰 40분 넘게 걸린 적이 있다(concurrency 때문에 다음 슬롯까지 막힘) → 시도마다 시간 제한 + 재시도
        timeout-minutes: 15
        run: |
          for i in 1 2 3; do
            timeout 180 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq xvfb fonts-noto-cjk > /dev/null && exit 0
            echo "apt 재시도 $i"; sleep 10
          done
          exit 1

      - name: Python 환경
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 20
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
          .venv/bin/python -m playwright install --with-deps chromium chrome
          python -m venv keyt/.venv
          keyt/.venv/bin/pip install -q -r keyt/requirements.txt

      - name: 키 파일 생성(Secrets → 파일, 커밋 안 됨)
        if: steps.gate.outputs.run == 'true'
        env:
          API_KEYS_ENV: ${{ secrets.API_KEYS_ENV }}
          KEYT_ENV: ${{ secrets.KEYT_ENV }}
        run: |
          printf '%s\n' "$API_KEYS_ENV" > api_keys.env
          printf '%s\n' "$KEYT_ENV" > keyt/.env
          mkdir -p logs

      - name: 로그인 쿠키 복원
        if: steps.gate.outputs.run == 'true'
        env:
          NAVER_COOKIES: ${{ secrets.NAVER_COOKIES }}
          TISTORY_COOKIES: ${{ secrets.TISTORY_COOKIES }}
        run: .venv/bin/python session_cookies.py restore

      - name: 티스토리 데몬 시작
        if: steps.gate.outputs.run == 'true'
        run: |
          nohup xvfb-run -a .venv/bin/python -u tistory_daemon.py > logs/tistory_daemon.log 2>&1 &
          for i in $(seq 1 36); do
            if curl -fs http://127.0.0.1:8765/health; then echo " ← 티스토리 로그인 OK"; break; fi
            sleep 5
          done
          curl -fs http://127.0.0.1:8765/health || { echo "::warning::티스토리 로그인 실패 — 쿠키 갱신 필요(이번엔 네이버만 발행)"; tail -20 logs/tistory_daemon.log; }

      - name: 발행 실행
        if: steps.gate.outputs.run == 'true'
        env:
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'guard' }}
        run: |
          if [ "$DRY" = "true" ]; then export DRY_RUN=1 SKIP_VISUAL_GATE=1; echo "드라이런"; fi
          if [ "$MODE" = "force" ]; then export FORCE_PUBLISH=1; fi
          if [ "$MODE" = "roundup" ]; then export FORCE_PUBLISH=1 FORCE_ROUNDUP=1; fi
          if [ "$MODE" = "roundup_tistory" ]; then export FORCE_PUBLISH=1 FORCE_ROUNDUP=1 TISTORY_ONLY=1; fi
          if [ "$MODE" = "guard" ]; then
            xvfb-run -a .venv/bin/python catchup_guard.py || true
          else
            xvfb-run -a .venv/bin/python run_daily_post.py || echo "::warning::run_daily_post 종료 코드 $?"
          fi
          tail -60 logs/run_daily_post.log || true

      - name: 티스토리 로그인 상태 기록(실패 원인 확인용)
        if: always() && steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          curl -fs http://127.0.0.1:8765/health > /dev/null && echo "티스토리 데몬: 로그인 OK" || { echo "티스토리 데몬: 로그인 실패 — 데몬 로그:"; grep -a "tistory-daemon" logs/tistory_daemon.log | tail -15; }

      - name: 갱신된 로그인 쿠키를 Secret에 다시 저장(만료 방지)
        if: (always()) && steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "GH_PAT 없음 — 쿠키 재저장 건너뜀"; exit 0; }
          # 티스토리: 데몬이 로그인된 상태일 때만(깨진 쿠키로 덮어쓰지 않게)
          if curl -fs http://127.0.0.1:8765/health > /dev/null; then
            curl -fs http://127.0.0.1:8765/cookies | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['n']>0; print(d['b64'])" > tistory.b64 \
              && gh secret set TISTORY_COOKIES --repo "$GITHUB_REPOSITORY" < tistory.b64 && echo "TISTORY_COOKIES 갱신"
          fi
          # 네이버: 이번 실행에서 실제 발행에 성공했을 때만
          if grep -q "발행 완료: https://blog.naver.com" logs/run_daily_post.log 2>/dev/null; then
            .venv/bin/python session_cookies.py export naver > naver.b64 \
              && gh secret set NAVER_COOKIES --repo "$GITHUB_REPOSITORY" < naver.b64 && echo "NAVER_COOKIES 갱신"
          fi
          rm -f tistory.b64 naver.b64

      - name: 네이버 순위 점검(하루 1번, 21시 이후 — 키워드 전략 피드백용)
        if: (always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)) && steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          f="outputs/rank/rank_$(date +%Y%m%d).json"
          if [ "$(date +%H)" -ge 21 ] && [ ! -f "$f" ]; then timeout 600 .venv/bin/python rank_check.py 14 || true; fi

      - name: 상태 저장(발행 이력·중복 방지)
        if: (always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)) && steps.gate.outputs.run == 'true'
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add topics.md used_state.json run_state.json spike_state.json outputs/cache/kw_volumes.json outputs/cache/blog_docs.json outputs/cache/llm_cands.json outputs/rank 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "state: $(date '+%Y-%m-%d %H:%M') 실행 결과"
            for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; git rebase --abort 2>/dev/null || true; sleep 5; done
          fi

      - name: 로그 보관
        if: (always()) && steps.gate.outputs.run == 'true'
        continue-on-error: true   # 계정 아티팩트 저장 한도에 걸려도 실행 자체는 성공 처리
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 3
